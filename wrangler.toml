# Static-assets Worker that serves the built Vocs site (the Pages/Worker split: this is
# the public site on ishtar.numetal.xyz; the API lives on the datebook Worker).
name = "ishtar-site"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true
routes = [{ pattern = "ishtar.numetal.xyz", custom_domain = true }]

[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
