name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history. checkout defaults to depth 1, which makes
          # `git rev-list --count HEAD -- <file>` return 1 for every file and
          # `git log -1 --format=%cs` return the deploy date for every document.
          # Any revision stamp computed at build time is a constant without this.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund
      - name: Build site (Vocs build then post-process)
        run: npx vocs build && bash scripts/postbuild.sh
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
