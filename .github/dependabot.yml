version: 2
updates:
  # Keep the pinned action SHAs current (Dependabot proposes SHA bumps with the tag in a comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
